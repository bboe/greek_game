<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gods &amp; Blades - Ancient Greece Quiz Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0d5c1;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #game {
    width: 800px;
    height: 600px;
    background: #16213e;
    border: 4px solid #c9a84c;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  .screen {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
  }

  .screen.active {
    display: flex;
  }

  /* ---- Title Screen ---- */
  #title-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    text-align: center;
  }

  #title-screen h1 {
    font-size: 56px;
    color: #c9a84c;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    margin-bottom: 8px;
  }

  #title-screen .subtitle {
    font-size: 18px;
    color: #8a7a5a;
    margin-bottom: 48px;
  }

  .btn {
    background: #c9a84c;
    color: #1a1a2e;
    border: none;
    padding: 14px 40px;
    font-size: 22px;
    font-family: Georgia, serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover {
    background: #dfc06a;
    transform: scale(1.05);
  }

  .btn:active {
    transform: scale(0.97);
  }

  /* ---- Select Screen ---- */
  #select-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
  }

  #select-screen h2 {
    font-size: 32px;
    color: #c9a84c;
    margin-bottom: 32px;
  }

  .god-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 0 60px;
  }

  .god-card {
    background: #1a1a3e;
    border: 3px solid #3a3a5e;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }

  .god-card:hover {
    border-color: #c9a84c;
    transform: scale(1.04);
  }

  .god-card canvas {
    display: block;
    margin: 0 auto 10px;
    image-rendering: pixelated;
  }

  .god-card .god-name {
    font-size: 22px;
    color: #c9a84c;
    margin-bottom: 4px;
  }

  .god-card .god-weapon {
    font-size: 14px;
    color: #8a9ab5;
  }

  /* ---- Battle Screen ---- */
  #battle-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    justify-content: flex-start;
    padding-top: 16px;
  }

  .battle-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    margin-bottom: 8px;
  }

  .fighter-info {
    text-align: center;
    width: 200px;
  }

  .fighter-info .name {
    font-size: 20px;
    color: #c9a84c;
    margin-bottom: 6px;
  }

  .hp-bar-bg {
    width: 100%;
    height: 18px;
    background: #333;
    border-radius: 9px;
    overflow: hidden;
    border: 2px solid #555;
  }

  .hp-bar {
    height: 100%;
    background: #4caf50;
    border-radius: 7px;
    transition: width 0.4s ease;
  }

  .hp-bar.low {
    background: #f44336;
  }

  .hp-text {
    font-size: 12px;
    color: #aaa;
    margin-top: 2px;
  }

  .battle-arena {
    width: 100%;
    height: 240px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: relative;
  }

  .battle-arena canvas {
    image-rendering: pixelated;
  }

  .battle-message {
    font-size: 18px;
    color: #e0d5c1;
    min-height: 28px;
    text-align: center;
    margin-bottom: 8px;
  }

  .question-box {
    background: #1a1a3e;
    border: 2px solid #3a3a5e;
    border-radius: 8px;
    padding: 16px 24px;
    width: 720px;
    text-align: center;
  }

  .question-box .question-text {
    font-size: 20px;
    margin-bottom: 16px;
    color: #e0d5c1;
  }

  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .answer-btn {
    background: #2a2a4e;
    border: 2px solid #4a4a6e;
    color: #e0d5c1;
    padding: 10px 16px;
    font-size: 16px;
    font-family: Georgia, serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .answer-btn:hover {
    background: #3a3a5e;
    border-color: #c9a84c;
  }

  .answer-btn.correct {
    background: #2e7d32;
    border-color: #4caf50;
  }

  .answer-btn.wrong {
    background: #7d2e2e;
    border-color: #f44336;
  }

  .answer-btn:disabled {
    cursor: default;
    opacity: 0.7;
  }

  /* ---- End Screen ---- */
  #end-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    text-align: center;
  }

  #end-screen h2 {
    font-size: 42px;
    color: #c9a84c;
    margin-bottom: 16px;
  }

  #end-screen .end-message {
    font-size: 20px;
    margin-bottom: 12px;
  }

  .stats {
    font-size: 16px;
    color: #8a9ab5;
    margin-bottom: 32px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div id="game">
  <!-- Title Screen -->
  <div id="title-screen" class="screen active">
    <h1>Gods &amp; Blades</h1>
    <p class="subtitle">An Ancient Greece Quiz Battle</p>
    <button class="btn" id="start-btn">Start Game</button>
  </div>

  <!-- God Selection Screen -->
  <div id="select-screen" class="screen">
    <h2>Choose Your God</h2>
    <div class="god-grid" id="god-grid">
      <!-- God cards inserted by JS -->
    </div>
  </div>

  <!-- Battle Screen -->
  <div id="battle-screen" class="screen">
    <div class="battle-header">
      <div class="fighter-info" id="player-info">
        <div class="name" id="player-name">Zeus</div>
        <div class="hp-bar-bg"><div class="hp-bar" id="player-hp-bar"></div></div>
        <div class="hp-text" id="player-hp-text">100 / 100</div>
      </div>
      <div class="fighter-info" id="monster-info">
        <div class="name" id="monster-name">Minotaur</div>
        <div class="hp-bar-bg"><div class="hp-bar" id="monster-hp-bar"></div></div>
        <div class="hp-text" id="monster-hp-text">80 / 80</div>
      </div>
    </div>

    <div class="battle-arena">
      <canvas id="player-canvas" width="128" height="128"></canvas>
      <canvas id="monster-canvas" width="128" height="128"></canvas>
    </div>

    <div class="battle-message" id="battle-message"></div>

    <div class="question-box" id="question-box">
      <div class="question-text" id="question-text">Loading question...</div>
      <div class="answers-grid" id="answers-grid">
        <!-- Answer buttons inserted by JS -->
      </div>
    </div>
  </div>

  <!-- End Screen -->
  <div id="end-screen" class="screen">
    <h2 id="end-title">Victory!</h2>
    <p class="end-message" id="end-message">You saved Ancient Greece!</p>
    <div class="stats" id="end-stats"></div>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>
</div>

<script>
  // ========== GAME DATA ==========
  const GODS = [

  const MONSTERS = [

  const QUESTIONS = [
    { q: 'Who is the king of the Greek gods?', a: ['Zeus', 'Poseidon', 'Ares', 'Hades'], correct: 0 },
    { q: 'Who is the Greek god of the sea?', a: ['Ares', 'Poseidon', 'Apollo', 'Hermes'], correct: 1 },
    { q: 'What weapon did Zeus use?', a: ['Sword', 'Trident', 'Thunderbolt', 'Bow'], correct: 2 },
    { q: 'What weapon is a three-pronged spear?', a: ['Javelin', 'Trident', 'Lance', 'Halberd'], correct: 1 },
    { q: 'Who is the goddess of wisdom and war strategy?', a: ['Hera', 'Aphrodite', 'Artemis', 'Athena'], correct: 3 },
    { q: 'What creature had snakes for hair?', a: ['Hydra', 'Cerberus', 'Medusa', 'Minotaur'], correct: 2 },
    { q: 'Who is the Greek god of war?', a: ['Ares', 'Hermes', 'Hephaestus', 'Poseidon'], correct: 0 },
    { q: 'What creature guards the Underworld?', a: ['Minotaur', 'Cyclops', 'Griffin', 'Cerberus'], correct: 3 },
    { q: 'How many heads does Cerberus have?', a: ['One', 'Two', 'Three', 'Five'], correct: 2 },
    { q: 'The Minotaur has the head of what animal?', a: ['Lion', 'Bull', 'Horse', 'Eagle'], correct: 1 },
    { q: 'Where did the Greek gods live?', a: ['Athens', 'Mount Olympus', 'Sparta', 'Troy'], correct: 1 },
    { q: 'What shield did Athena carry?', a: ['Buckler', 'Tower Shield', 'Aegis', 'Aspis'], correct: 2 },
    { q: 'Who forged weapons for the gods?', a: ['Ares', 'Hermes', 'Hephaestus', 'Apollo'], correct: 2 },
    { q: 'A Cyclops has how many eyes?', a: ['One', 'Two', 'Three', 'Four'], correct: 0 },
    { q: 'What was the Labyrinth built to contain?', a: ['Medusa', 'Hydra', 'Cerberus', 'Minotaur'], correct: 3 },
    { q: 'Who carried a bow and was goddess of the hunt?', a: ['Athena', 'Artemis', 'Aphrodite', 'Hera'], correct: 1 },
    { q: 'What happens when you cut off one of the Hydra\'s heads?', a: ['It dies', 'Two grow back', 'Nothing', 'It turns to stone'], correct: 1 },
    { q: 'What metal were Greek swords usually made of?', a: ['Iron', 'Gold', 'Bronze', 'Silver'], correct: 2 },
    { q: 'A Greek soldier\'s round shield is called a what?', a: ['Buckler', 'Aspis', 'Pavise', 'Scutum'], correct: 1 },
    { q: 'Who gave fire to humans and was punished by Zeus?', a: ['Hermes', 'Atlas', 'Prometheus', 'Hephaestus'], correct: 2 },
  ];

  let selectedGod = null;
  let currentMonsterIndex = 0;
  let playerHp = 0;
  let monsterHp = 0;
  let questionsCorrect = 0;
  let questionsTotal = 0;
  let questionQueue = [];

  function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ========== PIXEL ART DRAWING ==========
  // Each sprite is an array of rows; each character maps to a color.
  // '.' = transparent, letters map to palette entries per god/monster.

  function drawPixelGrid(ctx, grid, palette, scale) {
    const rows = grid.length;
    const cols = grid[0].length;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const offsetX = Math.floor((ctx.canvas.width - cols * scale) / 2);
    const offsetY = Math.floor((ctx.canvas.height - rows * scale) / 2);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ch = grid[r][c];
        if (ch !== '.' && palette[ch]) {
          ctx.fillStyle = palette[ch];
          ctx.fillRect(offsetX + c * scale, offsetY + r * scale, scale, scale);
        }
      }
    }
  }

  const GOD_SPRITES = {
    Zeus: {
      grid: [
        '....YYYY....',
        '...YYYYYY...',
        '...YEEEYY...',
        '...EEEEEE...',
        '....SMMS....',
        '....MMMM....',
        '..WWGGGGWW..',
        '..WGGGGGW...',
        '..WGGGGGW...',
        '...GGGGGG...',
        '....GGGG....',
        '....GG.GG...',
        '...GG...GG..',
        '...BB...BB..',
      ],
      palette: {Y:'#f0d060',E:'#f5e0a0',S:'#222',M:'#d4a070',G:'#e8e8f0',W:'#c9a84c',B:'#8B7355'},
    },
    Poseidon: {
      grid: [
        '....BBBB....',
        '...BBBBBB...',
        '...BEEEBB...',
        '...EEEEEE...',
        '....SMMS....',
        '....MMMM....',
        '..CCGGGGCC..',
        '..CGGGGGC...',
        '..CGGGGGC...',
        '...GGGGGG...',
        '....GGGG....',
        '....GG.GG...',
        '...GG...GG..',
        '...BB...BB..',
      ],
      palette: {B:'#4090d0',E:'#f5e0a0',S:'#222',M:'#c8a070',G:'#3070a0',C:'#60c0f0',BB:'#2a5080'},
    },
    Athena: {
      grid: [
        '....HHHH....',
        '...HHHHHH...',
        '..HHHHHHH...',
        '...GEEEG....',
        '...EEEEEE...',
        '....SMMS....',
        '....MMMM....',
        '..AAWWWWAA..',
        '..AWWWWWA...',
        '..AWWWWWA...',
        '...WWWWWW...',
        '....WW.WW...',
        '...WW...WW..',
        '...BB...BB..',
      ],
      palette: {H:'#c9a84c',G:'#a0a0b0',E:'#f5e0a0',S:'#222',M:'#d4a070',A:'#a0a0b0',W:'#e8e8f0',B:'#8B7355'},
    },
    Ares: {
      grid: [
        '....RRRR....',
        '...RRRRRR...',
        '...REEERR...',
        '...EEEEEE...',
        '....SMMS....',
        '....MMMM....',
        '..RRGGGGKK..',
        '..RGGGGGK...',
        '..RGGGGGK...',
        '...GGGGGG...',
        '....GGGG....',
        '....GG.GG...',
        '...GG...GG..',
        '...BB...BB..',
      ],
      palette: {R:'#d04040',E:'#f5e0a0',S:'#222',M:'#d4a070',G:'#8B0000',K:'#333',B:'#8B7355'},
    },
  };

  const MONSTER_SPRITES = {
    Minotaur: {
      grid: [
        '.HH......HH.',
        '.HHHHHHHHH..',
        '..HBBBBBBH..',
        '..BBEBBEBB..',
        '..BBBBBBBB..',
        '...BNNNNB...',
        '...BNMMBN...',
        '....BBBB....',
        '..RRRRRRR...',
        '..RRRRRRRR..',
        '.RRRRRRRRR..',
        '...RRRRRR...',
        '...RR..RR...',
        '..HH...HH..',
      ],
      palette: {H:'#6B4226',B:'#8B6914',E:'#ff2020',N:'#5a4010',M:'#3a2808',R:'#a07040',},
    },
    Medusa: {
      grid: [
        '.GGG..GGG...',
        'GGGGGGGGG...',
        'G.GGGGG.GG..',
        '..GEEEGGG...',
        '..GEEEEE....',
        '...EYYYE....',
        '...EMMME....',
        '....EEEE....',
        '..GGDDDDGG..',
        '..GDDDDDG...',
        '..GDDDDDG...',
        '...DDDDDD...',
        '..SSSSSSSS..',
        '.SS..SS..SS.',
      ],
      palette: {G:'#4a8040',E:'#90b070',Y:'#ffff00',M:'#3a2020',D:'#5a9050',S:'#3a6030'},
    },
    Hydra: {
      grid: [
        'HH..HH..HH..',
        '.HH.HH.HH...',
        '..HHHHHH.....',
        '..EEEEEE.....',
        '..REEREER....',
        '..EEEEEE.....',
        '...GGGGGG....',
        '..GGGGGGGG...',
        '..GGGGGGGG...',
        '..GGGGGGGG...',
        '...GGGGGGG...',
        '...GG.GGG....',
        '..GG...GG....',
        '.GG.....GG...',
      ],
      palette: {H:'#306030',E:'#60a060',R:'#ff3030',G:'#408040'},
    },
    Cyclops: {
      grid: [
        '....BBBB....',
        '...BBBBBB...',
        '..BBBBBBBB..',
        '..BBEEEEBB..',
        '..BBRRRRBB..',
        '..BBEEEEBB..',
        '...BBMMBB...',
        '...BBBBBB...',
        '..TTTTTTTT..',
        '..TTTTTTTT..',

      ],
      palette: {B:'#c0a080',E:'#f0f0f0',R:'#ff0000',M:'#8a6040',T:'#8B7355'},
    },
    Cerberus: {
      grid: [
        'DD.DD.DD....',
        'DDDDDDDDD...',
        'DEEDEDEDD....',
        'DDDDDDDDD...',
        '.DMMMDMMD...',
        '..DDDDDDD...',
        '...KKKKKK...',
        '..KKKKKKKK..',
        '..KKKKKKKK..',
        '..KK.KK.KK..',
        '..KK.KK.KK..',
        '.KK..KK..KK.',
        '......KK.....',

      ],
      palette: {D:'#3a3a3a',E:'#ff3030',M:'#f0f0f0',K:'#2a2a2a'},
    },
  };

  function drawGodSprite(canvas, godName) {
    const sprite = GOD_SPRITES[godName];
    if (!sprite) return;
    const ctx = canvas.getContext('2d');
    drawPixelGrid(ctx, sprite.grid, sprite.palette, 8);
  }

  function drawMonsterSprite(canvas, monsterName) {
    const sprite = MONSTER_SPRITES[monsterName];
    if (!sprite) return;
    const ctx = canvas.getContext('2d');
    drawPixelGrid(ctx, sprite.grid, sprite.palette, 8);
  }

  // ========== GOD SELECTION ==========
  function buildGodSelection() {
    const grid = document.getElementById('god-grid');
    grid.innerHTML = '';
    GODS.forEach((god, i) => {
      const card = document.createElement('div');
      card.className = 'god-card';
      card.innerHTML = `
        <canvas width="96" height="112"></canvas>
        <div class="god-name">${god.name}</div>
        <div class="god-weapon">${god.weapon}</div>
      `;
      const canvas = card.querySelector('canvas');
      drawGodSprite(canvas, god.name);
      card.addEventListener('click', () => selectGod(i));
      grid.appendChild(card);
    });
  }

  function selectGod(index) {
    selectedGod = GODS[index];
    startGame();
  }

  // ========== BATTLE MECHANICS ==========
  function startGame() {
    currentMonsterIndex = 0;
    playerHp = selectedGod.hp;
    questionsCorrect = 0;
    questionsTotal = 0;
    questionQueue = shuffleArray(QUESTIONS);
    startBattle();
  }

  function startBattle() {
    const monster = MONSTERS[currentMonsterIndex];
    monsterHp = monster.hp;
    updateBattleUI();
    document.getElementById('battle-message').textContent = `A wild ${monster.name} appears!`;
    showScreen('battle-screen');
    setTimeout(showNextQuestion, 1000);
  }

  function updateBattleUI() {
    const monster = MONSTERS[currentMonsterIndex];

    document.getElementById('player-name').textContent = selectedGod.name;
    document.getElementById('player-hp-bar').style.width = Math.max(0, (playerHp / selectedGod.hp) * 100) + '%';
    document.getElementById('player-hp-bar').className = 'hp-bar' + (playerHp / selectedGod.hp < 0.3 ? ' low' : '');
    document.getElementById('player-hp-text').textContent = `${Math.max(0, playerHp)} / ${selectedGod.hp}`;

    document.getElementById('monster-name').textContent = monster.name;
    document.getElementById('monster-hp-bar').style.width = Math.max(0, (monsterHp / monster.hp) * 100) + '%';
    document.getElementById('monster-hp-bar').className = 'hp-bar' + (monsterHp / monster.hp < 0.3 ? ' low' : '');
    document.getElementById('monster-hp-text').textContent = `${Math.max(0, monsterHp)} / ${monster.hp}`;

    // Draw sprites
    drawGodSprite(document.getElementById('player-canvas'), selectedGod.name);
    drawMonsterSprite(document.getElementById('monster-canvas'), monster.name);
  }

  function showNextQuestion() {
    if (questionQueue.length === 0) {
      questionQueue = shuffleArray(QUESTIONS);
    }
    const q = questionQueue.pop();
    document.getElementById('question-text').textContent = q.q;

    const grid = document.getElementById('answers-grid');
    grid.innerHTML = '';
    q.a.forEach((answer, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = answer;
      btn.addEventListener('click', () => handleAnswer(i, q.correct, btn));
      grid.appendChild(btn);
    });
  }

  function handleAnswer(chosen, correctIndex, btn) {
    const buttons = document.querySelectorAll('.answer-btn');
    buttons.forEach(b => b.disabled = true);

    questionsTotal++;
    const isCorrect = chosen === correctIndex;

    // Highlight correct/wrong
    buttons[correctIndex].classList.add('correct');
    if (!isCorrect) {
      btn.classList.add('wrong');
    }

    if (isCorrect) {
      questionsCorrect++;
      const dmg = selectedGod.damage + Math.floor(Math.random() * 10);
      monsterHp -= dmg;
      document.getElementById('battle-message').textContent =
        `Correct! ${selectedGod.name} attacks with ${selectedGod.weapon} for ${dmg} damage!`;
    } else {
      const dmg = Math.floor(selectedGod.damage * 0.3) + Math.floor(Math.random() * 5);
      monsterHp -= dmg;
      document.getElementById('battle-message').textContent =
        `Wrong! ${selectedGod.name} attacks weakly for only ${dmg} damage...`;
    }

    updateBattleUI();

    setTimeout(() => {
      if (monsterHp <= 0) {
        monsterDefeated();
      } else {
        monsterAttacks();
      }
    }, 1500);
  }

  function monsterAttacks() {
    const monster = MONSTERS[currentMonsterIndex];
    const dmg = 10 + Math.floor(Math.random() * 15);
    playerHp -= dmg;
    document.getElementById('battle-message').textContent =
      `${monster.name} attacks for ${dmg} damage!`;
    updateBattleUI();

    setTimeout(() => {
      if (playerHp <= 0) {
        endGame(false);
      } else {
        showNextQuestion();
      }
    }, 1200);
  }

  function monsterDefeated() {
    const monster = MONSTERS[currentMonsterIndex];
    document.getElementById('battle-message').textContent =
      `${monster.name} has been defeated!`;

    currentMonsterIndex++;
    if (currentMonsterIndex >= MONSTERS.length) {
      setTimeout(() => endGame(true), 1500);
    } else {
      setTimeout(() => startBattle(), 1500);
    }
  }

  function endGame(won) {
    document.getElementById('end-title').textContent = won ? 'Victory!' : 'Defeat!';
    document.getElementById('end-message').textContent = won
      ? 'You saved Ancient Greece!'
      : `You were defeated by the ${MONSTERS[currentMonsterIndex].name}...`;
    document.getElementById('end-stats').innerHTML =
      `Monsters defeated: ${currentMonsterIndex} / ${MONSTERS.length}<br>` +
      `Questions correct: ${questionsCorrect} / ${questionsTotal}<br>` +
      `Accuracy: ${questionsTotal > 0 ? Math.round((questionsCorrect / questionsTotal) * 100) : 0}%`;
    showScreen('end-screen');
  }

  // ========== SCREEN MANAGEMENT ==========
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ========== NAVIGATION ==========
  document.getElementById('start-btn').addEventListener('click', () => {
    buildGodSelection();
    showScreen('select-screen');
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    showScreen('title-screen');
  });
</script>

</body>
</html>
