<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gods &amp; Blades - Ancient Greece Quiz Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0d5c1;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #game {
    width: 800px;
    height: 600px;
    background: #16213e;
    border: 4px solid #c9a84c;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  .screen {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
  }

  .screen.active {
    display: flex;
  }

  /* ---- Title Screen ---- */
  #title-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    text-align: center;
  }

  #title-screen h1 {
    font-size: 56px;
    color: #c9a84c;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    margin-bottom: 8px;
  }

  #title-screen .subtitle {
    font-size: 18px;
    color: #8a7a5a;
    margin-bottom: 48px;
  }

  .btn {
    background: #c9a84c;
    color: #1a1a2e;
    border: none;
    padding: 14px 40px;
    font-size: 22px;
    font-family: Georgia, serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover {
    background: #dfc06a;
    transform: scale(1.05);
  }

  .btn:active {
    transform: scale(0.97);
  }

  /* ---- Select Screen ---- */
  #select-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
  }

  #select-screen h2 {
    font-size: 32px;
    color: #c9a84c;
    margin-bottom: 32px;
  }

  .god-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 0 60px;
  }

  .god-card {
    background: #1a1a3e;
    border: 3px solid #3a3a5e;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }

  .god-card:hover {
    border-color: #c9a84c;
    transform: scale(1.04);
  }

  .god-card canvas {
    display: block;
    margin: 0 auto 10px;
    image-rendering: pixelated;
  }

  .god-card .god-name {
    font-size: 22px;
    color: #c9a84c;
    margin-bottom: 4px;
  }

  .god-card .god-weapon {
    font-size: 14px;
    color: #8a9ab5;
  }

  /* ---- Battle Screen ---- */
  #battle-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    justify-content: flex-start;
    padding-top: 16px;
  }

  .battle-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    margin-bottom: 8px;
  }

  .fighter-info {
    text-align: center;
    width: 200px;
  }

  .fighter-info .name {
    font-size: 20px;
    color: #c9a84c;
    margin-bottom: 6px;
  }

  .hp-bar-bg {
    width: 100%;
    height: 18px;
    background: #333;
    border-radius: 9px;
    overflow: hidden;
    border: 2px solid #555;
  }

  .hp-bar {
    height: 100%;
    background: #4caf50;
    border-radius: 7px;
    transition: width 0.4s ease;
  }

  .hp-bar.low {
    background: #f44336;
  }

  .hp-text {
    font-size: 12px;
    color: #aaa;
    margin-top: 2px;
  }

  .battle-arena {
    width: 100%;
    height: 240px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: relative;
  }

  .battle-arena canvas {
    image-rendering: pixelated;
  }

  .battle-message {
    font-size: 18px;
    color: #e0d5c1;
    min-height: 28px;
    text-align: center;
    margin-bottom: 8px;
  }

  .question-box {
    background: #1a1a3e;
    border: 2px solid #3a3a5e;
    border-radius: 8px;
    padding: 16px 24px;
    width: 720px;
    text-align: center;
  }

  .question-box .question-text {
    font-size: 20px;
    margin-bottom: 16px;
    color: #e0d5c1;
  }

  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .answer-btn {
    background: #2a2a4e;
    border: 2px solid #4a4a6e;
    color: #e0d5c1;
    padding: 10px 16px;
    font-size: 16px;
    font-family: Georgia, serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .answer-btn:hover {
    background: #3a3a5e;
    border-color: #c9a84c;
  }

  .answer-btn.correct {
    background: #2e7d32;
    border-color: #4caf50;
  }

  .answer-btn.wrong {
    background: #7d2e2e;
    border-color: #f44336;
  }

  .answer-btn:disabled {
    cursor: default;
    opacity: 0.7;
  }

  /* ---- End Screen ---- */
  #end-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    text-align: center;
  }

  #end-screen h2 {
    font-size: 42px;
    color: #c9a84c;
    margin-bottom: 16px;
  }

  #end-screen .end-message {
    font-size: 20px;
    margin-bottom: 12px;
  }

  .stats {
    font-size: 16px;
    color: #8a9ab5;
    margin-bottom: 32px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div id="game">
  <!-- Title Screen -->
  <div id="title-screen" class="screen active">
    <h1>Gods &amp; Blades</h1>
    <p class="subtitle">An Ancient Greece Quiz Battle</p>
    <button class="btn" id="start-btn">Start Game</button>
  </div>

  <!-- God Selection Screen -->
  <div id="select-screen" class="screen">
    <h2>Choose Your God</h2>
    <div class="god-grid" id="god-grid">
      <!-- God cards inserted by JS -->
    </div>
  </div>

  <!-- Battle Screen -->
  <div id="battle-screen" class="screen">
    <div class="battle-header">
      <div class="fighter-info" id="player-info">
        <div class="name" id="player-name">Zeus</div>
        <div class="hp-bar-bg"><div class="hp-bar" id="player-hp-bar"></div></div>
        <div class="hp-text" id="player-hp-text">100 / 100</div>
      </div>
      <div class="fighter-info" id="monster-info">
        <div class="name" id="monster-name">Minotaur</div>
        <div class="hp-bar-bg"><div class="hp-bar" id="monster-hp-bar"></div></div>
        <div class="hp-text" id="monster-hp-text">80 / 80</div>
      </div>
    </div>

    <div class="battle-arena">
      <canvas id="player-canvas" width="128" height="128"></canvas>
      <canvas id="monster-canvas" width="128" height="128"></canvas>
    </div>

    <div class="battle-message" id="battle-message"></div>

    <div class="question-box" id="question-box">
      <div class="question-text" id="question-text">Loading question...</div>
      <div class="answers-grid" id="answers-grid">
        <!-- Answer buttons inserted by JS -->
      </div>
    </div>
  </div>

  <!-- End Screen -->
  <div id="end-screen" class="screen">
    <h2 id="end-title">Victory!</h2>
    <p class="end-message" id="end-message">You saved Ancient Greece!</p>
    <div class="stats" id="end-stats"></div>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>
</div>

<script>
  // ========== SCREEN MANAGEMENT ==========
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ========== NAVIGATION ==========
  document.getElementById('start-btn').addEventListener('click', () => {
    showScreen('select-screen');
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    showScreen('title-screen');
  });
</script>

</body>
</html>
