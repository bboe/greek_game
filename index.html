<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gods &amp; Blades - Ancient Greece Quiz Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #e0d5c1;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #game {
    width: 800px;
    height: 600px;
    background: #16213e;
    border: 4px solid #c9a84c;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  .screen {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 0;
    left: 0;
  }

  .screen.active {
    display: flex;
  }

  /* ---- Title Screen ---- */
  #title-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    text-align: center;
  }

  #title-screen h1 {
    font-size: 56px;
    color: #c9a84c;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    margin-bottom: 8px;
  }

  #title-screen .subtitle {
    font-size: 18px;
    color: #8a7a5a;
    margin-bottom: 48px;
  }

  .btn {
    background: #c9a84c;
    color: #1a1a2e;
    border: none;
    padding: 14px 40px;
    font-size: 22px;
    font-family: Georgia, serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .btn:hover {
    background: #dfc06a;
    transform: scale(1.05);
  }

  .btn:active {
    transform: scale(0.97);
  }

  /* ---- Select Screen ---- */
  #select-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
  }

  #select-screen h2 {
    font-size: 32px;
    color: #c9a84c;
    margin-bottom: 32px;
  }

  .select-layout {
    display: flex;
    gap: 24px;
    padding: 0 24px;
    align-items: flex-start;
    width: 100%;
  }

  .god-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    flex: 1;
  }

  .god-info-panel {
    width: 200px;
    background: #1a1a3e;
    border: 2px solid #3a3a5e;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .god-info-panel .info-name {
    font-size: 22px;
    color: #c9a84c;
    margin-bottom: 8px;
  }

  .god-info-panel .info-weapon {
    font-size: 14px;
    color: #8a9ab5;
    margin-bottom: 16px;
  }

  .god-info-panel .info-hint {
    font-size: 14px;
    color: #555;
  }

  .god-info-panel .stat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 14px;
    color: #8a9ab5;
  }

  .god-info-panel .stat-label {
    width: 36px;
    text-align: right;
  }

  .god-info-panel .stat-bar-bg {
    flex: 1;
    height: 10px;
    background: #333;
    border-radius: 5px;
    overflow: hidden;
  }

  .god-info-panel .stat-bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .god-card {
    background: #1a1a3e;
    border: 3px solid #3a3a5e;
    border-radius: 8px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }

  .god-card:hover {
    border-color: #c9a84c;
    transform: scale(1.04);
  }

  .god-card canvas {
    display: block;
    margin: 0 auto 10px;
    image-rendering: pixelated;
  }

  .god-card .god-name {
    font-size: 22px;
    color: #c9a84c;
    margin-bottom: 4px;
  }

  .god-card .god-weapon {
    font-size: 14px;
    color: #8a9ab5;
  }


  /* ---- Battle Screen ---- */
  #battle-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    justify-content: flex-start;
    padding-top: 16px;
  }

  .battle-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 24px;
    margin-bottom: 8px;
  }

  .fighter-info {
    text-align: center;
    width: 200px;
  }

  .fighter-info .name {
    font-size: 20px;
    color: #c9a84c;
    margin-bottom: 6px;
  }

  .hp-bar-bg {
    width: 100%;
    height: 18px;
    background: #333;
    border-radius: 9px;
    overflow: hidden;
    border: 2px solid #555;
  }

  .hp-bar {
    height: 100%;
    background: #4caf50;
    border-radius: 7px;
    transition: width 0.4s ease;
  }

  .hp-bar.low {
    background: #f44336;
  }

  .hp-text {
    font-size: 12px;
    color: #aaa;
    margin-top: 2px;
  }

  .battle-arena {
    width: 100%;
    height: 240px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    position: relative;
  }

  .battle-arena canvas {
    image-rendering: pixelated;
  }

  .battle-message {
    font-size: 18px;
    color: #e0d5c1;
    min-height: 28px;
    text-align: center;
    margin-bottom: 8px;
  }

  .question-box {
    background: #1a1a3e;
    border: 2px solid #3a3a5e;
    border-radius: 8px;
    padding: 16px 24px;
    width: 720px;
    text-align: center;
  }

  .question-box .question-text {
    font-size: 20px;
    margin-bottom: 16px;
    color: #e0d5c1;
  }

  .answers-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .answer-btn {
    background: #2a2a4e;
    border: 2px solid #4a4a6e;
    color: #e0d5c1;
    padding: 10px 16px;
    font-size: 16px;
    font-family: Georgia, serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .answer-btn:hover {
    background: #3a3a5e;
    border-color: #c9a84c;
  }

  .answer-btn.correct {
    background: #2e7d32;
    border-color: #4caf50;
  }

  .answer-btn.wrong {
    background: #7d2e2e;
    border-color: #f44336;
  }

  .answer-btn:disabled {
    cursor: default;
    opacity: 0.7;
  }

  /* ---- Animations ---- */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  @keyframes flash-white {
    0% { filter: brightness(1); }
    50% { filter: brightness(3); }
    100% { filter: brightness(1); }
  }

  @keyframes float-up {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }

  .shake {
    animation: shake 0.4s ease;
  }

  .flash {
    animation: flash-white 0.3s ease;
  }

  .damage-number {
    position: absolute;
    font-size: 28px;
    font-weight: bold;
    pointer-events: none;
    animation: float-up 1s ease-out forwards;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  }

  .damage-number.big {
    color: #ffcc00;
    font-size: 36px;
  }

  .damage-number.small {
    color: #ff6666;
    font-size: 24px;
  }

  .confetti {
    position: absolute;
    font-size: 28px;
    pointer-events: none;
    animation: confetti-fall 1.5s ease-out forwards;
  }

  @keyframes confetti-fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(120px) rotate(360deg) scale(0.5); }
  }

  .heal-heart {
    position: absolute;
    font-size: 28px;
    pointer-events: none;
    animation: heart-float 1.2s ease-out forwards;
  }

  @keyframes heart-float {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    50% { opacity: 1; transform: translateY(-30px) scale(1.3); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
  }

  /* ---- Screen Transitions ---- */
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .screen.active {
    animation: fade-in 0.4s ease;
  }

  /* ---- Monster Progress Bar ---- */
  .progress-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 8px;
  }

  .progress-pip {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #333;
    border: 2px solid #555;
    transition: background 0.3s, border-color 0.3s;
  }

  .progress-pip.defeated {
    background: #4caf50;
    border-color: #6dd670;
  }

  .progress-pip.current {
    background: #c9a84c;
    border-color: #dfc06a;
  }

  /* ---- VS Text ---- */
  .vs-text {
    font-size: 32px;
    color: #c9a84c;
    font-weight: bold;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* ---- End Screen ---- */
  #end-screen {
    background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
    text-align: center;
  }

  #end-screen h2 {
    font-size: 42px;
    color: #c9a84c;
    margin-bottom: 16px;
  }

  #end-screen .end-message {
    font-size: 20px;
    margin-bottom: 12px;
  }

  .stats {
    font-size: 16px;
    color: #8a9ab5;
    margin-bottom: 32px;
    line-height: 1.8;
  }
</style>
</head>

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      if (imageCache[src]) { resolve(imageCache[src]); return; }
      const img = new Image();
      img.onload = () => { imageCache[src] = img; resolve(img); };
      img.onerror = () => resolve(null); // fall back to pixel art on error
      img.src = src;
    });
  }

  function drawImageOnCanvas(canvas, img, frames) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Source region: first frame if sprite sheet, otherwise full image
    const srcW = frames ? img.width / frames : img.width;
    const srcH = img.height;
    // Scale to fit canvas while maintaining aspect ratio
    const scale = Math.min(canvas.width / srcW, canvas.height / srcH);
    const w = srcW * scale;
    const h = srcH * scale;
    const x = (canvas.width - w) / 2;
    const y = (canvas.height - h) / 2;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, srcW, srcH, x, y, w, h);
  }

    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {

      [a[i], a[j]] = [a[j], a[i]];
    }

  // ========== PIXEL ART DRAWING ==========
  // Each sprite is an array of rows; each character maps to a color.
  // '.' = transparent, letters map to palette entries per god/monster.

  function drawPixelGrid(ctx, grid, palette, scale) {
    const rows = grid.length;
    const cols = grid[0].length;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const offsetX = Math.floor((ctx.canvas.width - cols * scale) / 2);
    const offsetY = Math.floor((ctx.canvas.height - rows * scale) / 2);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const ch = grid[r][c];
        if (ch !== '.' && palette[ch]) {
          ctx.fillStyle = palette[ch];
          ctx.fillRect(offsetX + c * scale, offsetY + r * scale, scale, scale);
        }
      }
    }
  }

  async function drawOverride(canvas, override) {
    const src = typeof override === 'string' ? override : override.src;
    const frames = typeof override === 'object' ? override.frames : null;
    const img = await loadImage(src);
    if (img) { drawImageOnCanvas(canvas, img, frames); return true; }
    return false;
  }

  async function drawGodSprite(canvas, godName) {
    const override = IMAGE_OVERRIDES.gods[godName];
    if (override && await drawOverride(canvas, override)) return;
    const sprite = GOD_SPRITES[godName];
    if (!sprite) return;
    const ctx = canvas.getContext('2d');
    drawPixelGrid(ctx, sprite.grid, sprite.palette, 5);
  }

  async function drawMonsterSprite(canvas, monsterName) {
    const override = IMAGE_OVERRIDES.monsters[monsterName];
    if (override && await drawOverride(canvas, override)) return;
    const sprite = MONSTER_SPRITES[monsterName];
    if (!sprite) return;
    const ctx = canvas.getContext('2d');
    drawPixelGrid(ctx, sprite.grid, sprite.palette, 5);
  }

  // ========== GOD SELECTION ==========
  function buildGodSelection() {
    const grid = document.getElementById('god-grid');
    grid.innerHTML = '';
    GODS.forEach((god, i) => {
      const card = document.createElement('div');
      card.className = 'god-card';
      card.innerHTML = `
        <canvas width="120" height="128"></canvas>
        <div class="god-name">${god.name}</div>
        <div class="god-weapon">${god.weapon}</div>
      `;
      const canvas = card.querySelector('canvas');
      drawGodSprite(canvas, god.name);
      card.addEventListener('click', () => selectGod(i));
      card.addEventListener('mouseenter', () => showGodInfo(god));
      card.addEventListener('mouseleave', clearGodInfo);
      grid.appendChild(card);
    });
  }

  function showGodInfo(god) {
    const panel = document.getElementById('god-info-panel');
    const hpPct = Math.round((god.hp / 130) * 100);
    const dmgPct = Math.round((god.damage / 35) * 100);
    panel.innerHTML = `
      <div class="info-name">${god.name}</div>
      <div class="info-weapon">${god.weapon}</div>
      <div class="stat-row">
        <span class="stat-label">HP</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${hpPct}%;background:#4caf50;"></div></div>
        <span>${god.hp}</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">ATK</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${dmgPct}%;background:#f44336;"></div></div>
        <span>${god.damage}</span>
      </div>
    `;
  }

  function clearGodInfo() {
    document.getElementById('god-info-panel').innerHTML =
      '<div class="info-hint">Hover over a god to see their stats</div>';
  }

  function selectGod(index) {
    selectedGod = GODS[index];
    sfxSelect();
    startGame();
  }

  // ========== BATTLE MECHANICS ==========
  function startGame() {
    currentMonsterIndex = 0;
    playerHp = selectedGod.hp;
    questionsCorrect = 0;
    questionsTotal = 0;
    questionQueue = shuffleArray(QUESTIONS);
    startBattle();
  }

  function startBattle() {
    const monster = MONSTERS[currentMonsterIndex];
    monsterHp = monster.hp;
    updateBattleUI();
    document.getElementById('battle-message').textContent = `A wild ${monster.name} appears!`;
    showScreen('battle-screen');
    setTimeout(showNextQuestion, 1000);
  }

  function updateBattleUI() {
    const monster = MONSTERS[currentMonsterIndex];

    document.getElementById('player-name').textContent = selectedGod.name;
    document.getElementById('player-hp-bar').style.width = Math.max(0, (playerHp / selectedGod.hp) * 100) + '%';
    document.getElementById('player-hp-bar').className = 'hp-bar' + (playerHp / selectedGod.hp < 0.3 ? ' low' : '');
    document.getElementById('player-hp-text').textContent = `${Math.max(0, playerHp)} / ${selectedGod.hp}`;

    document.getElementById('monster-name').textContent = monster.name;
    document.getElementById('monster-hp-bar').style.width = Math.max(0, (monsterHp / monster.hp) * 100) + '%';
    document.getElementById('monster-hp-bar').className = 'hp-bar' + (monsterHp / monster.hp < 0.3 ? ' low' : '');
    document.getElementById('monster-hp-text').textContent = `${Math.max(0, monsterHp)} / ${monster.hp}`;

    // Draw sprites
    drawGodSprite(document.getElementById('player-canvas'), selectedGod.name);
    drawMonsterSprite(document.getElementById('monster-canvas'), monster.name);

    // Update progress pips
    const bar = document.getElementById('progress-bar');
    bar.innerHTML = '';
    MONSTERS.forEach((m, i) => {
      const pip = document.createElement('div');
      pip.className = 'progress-pip';
      pip.title = m.name;
      if (i < currentMonsterIndex) pip.classList.add('defeated');
      if (i === currentMonsterIndex) pip.classList.add('current');
      bar.appendChild(pip);
    });
  }

  function showNextQuestion() {
    if (questionQueue.length === 0) {
      questionQueue = shuffleArray(QUESTIONS);
    }
    const q = questionQueue.pop();
    document.getElementById('question-text').textContent = q.q;

    const grid = document.getElementById('answers-grid');
    grid.innerHTML = '';
    q.a.forEach((answer, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = answer;
      btn.addEventListener('click', () => handleAnswer(i, q.correct, btn));
      grid.appendChild(btn);
    });
  }

  // ========== SOUND EFFECTS ==========
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playTone(freq, duration, type = 'square', volume = 0.15) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) { /* audio not supported */ }
  }

  function sfxCorrect() {
    playTone(523, 0.1, 'square');
    setTimeout(() => playTone(659, 0.1, 'square'), 100);
    setTimeout(() => playTone(784, 0.2, 'square'), 200);
  }

  function sfxWrong() {
    playTone(200, 0.15, 'sawtooth', 0.1);
    setTimeout(() => playTone(150, 0.3, 'sawtooth', 0.1), 150);
  }

  function sfxHit() {
    playTone(100, 0.1, 'square', 0.2);
    setTimeout(() => playTone(80, 0.15, 'square', 0.15), 50);
  }

  function sfxVictory() {
    [523, 587, 659, 784, 880, 1047].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.2, 'square', 0.12), i * 120);
    });
  }

  function sfxDefeat() {
    [400, 350, 300, 250, 200].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.25, 'sawtooth', 0.1), i * 200);
    });
  }

  function sfxSelect() {
    playTone(440, 0.08, 'square', 0.1);
    setTimeout(() => playTone(660, 0.12, 'square', 0.1), 80);
  }

  function sfxMonsterDefeated() {
    playTone(300, 0.1, 'square');
    setTimeout(() => playTone(400, 0.1, 'square'), 100);
    setTimeout(() => playTone(500, 0.15, 'square'), 200);
  }

  // ========== ANIMATION HELPERS ==========
  function animateShake(element) {
    element.classList.remove('shake');
    void element.offsetWidth; // force reflow to restart animation
    element.classList.add('shake');
    setTimeout(() => element.classList.remove('shake'), 400);
  }

  function animateFlash(element) {
    element.classList.remove('flash');
    void element.offsetWidth;
    element.classList.add('flash');
    setTimeout(() => element.classList.remove('flash'), 300);
  }

  function showDamageNumber(targetId, dmg, isBig) {
    const arena = document.querySelector('.battle-arena');
    const target = document.getElementById(targetId);
    const rect = target.getBoundingClientRect();
    const arenaRect = arena.getBoundingClientRect();

    const num = document.createElement('div');
    num.className = 'damage-number ' + (isBig ? 'big' : 'small');
    num.textContent = '-' + dmg;
    num.style.left = (rect.left - arenaRect.left + rect.width / 2 - 20) + 'px';
    num.style.top = (rect.top - arenaRect.top + 10) + 'px';
    arena.appendChild(num);
    setTimeout(() => num.remove(), 1000);
  }

  function handleAnswer(chosen, correctIndex, btn) {
    const buttons = document.querySelectorAll('.answer-btn');
    buttons.forEach(b => b.disabled = true);

    questionsTotal++;
    const isCorrect = chosen === correctIndex;

    // Highlight correct/wrong
    buttons[correctIndex].classList.add('correct');
    if (!isCorrect) {
      btn.classList.add('wrong');
    }

    if (isCorrect) {
      questionsCorrect++;
      const dmg = selectedGod.damage + Math.floor(Math.random() * 10);
      monsterHp -= dmg;
      document.getElementById('battle-message').textContent =
        `Correct! ${selectedGod.name} attacks with ${selectedGod.weapon} for ${dmg} damage!`;
      animateShake(document.getElementById('monster-canvas'));
      animateFlash(document.getElementById('monster-canvas'));
      showDamageNumber('monster-canvas', dmg, true);
      sfxCorrect();
    } else {
      const dmg = Math.floor(selectedGod.damage * 0.3) + Math.floor(Math.random() * 5);
      monsterHp -= dmg;
      document.getElementById('battle-message').textContent =
        `Wrong! ${selectedGod.name} attacks weakly for only ${dmg} damage...`;
      animateShake(document.getElementById('monster-canvas'));
      showDamageNumber('monster-canvas', dmg, false);
      sfxWrong();
    }

    updateBattleUI();

    setTimeout(() => {
      if (monsterHp <= 0) {
        monsterDefeated();
      } else {
        monsterAttacks();
      }
    }, 1500);
  }

  function monsterAttacks() {
    const monster = MONSTERS[currentMonsterIndex];
    const dmg = 10 + Math.floor(Math.random() * 15);
    playerHp -= dmg;
    document.getElementById('battle-message').textContent =
      `${monster.name} attacks for ${dmg} damage!`;
    animateShake(document.getElementById('player-canvas'));
    showDamageNumber('player-canvas', dmg, false);
    sfxHit();
    updateBattleUI();

    setTimeout(() => {
      if (playerHp <= 0) {
        endGame(false);
      } else {
        showNextQuestion();
      }
    }, 1200);
  }

  function showHealHearts(targetId, count) {
    const arena = document.querySelector('.battle-arena');
    const target = document.getElementById(targetId);
    const rect = target.getBoundingClientRect();
    const arenaRect = arena.getBoundingClientRect();
    const cx = rect.left - arenaRect.left + rect.width / 2;
    const cy = rect.top - arenaRect.top + rect.height / 2;

    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const heart = document.createElement('div');
        heart.className = 'heal-heart';
        heart.textContent = '\u2764\uFE0F';
        heart.style.left = (cx - 14 + (Math.random() - 0.5) * 50) + 'px';
        heart.style.top = (cy - 14 + (Math.random() - 0.5) * 30) + 'px';
        arena.appendChild(heart);
        setTimeout(() => heart.remove(), 1200);
      }, i * 150);
    }
  }

  function showConfetti() {
    const game = document.getElementById('game');
    const emojis = ['\uD83C\uDF89', '\uD83C\uDF8A', '\u2728', '\uD83C\uDF1F', '\uD83C\uDFC6', '\uD83E\uDD73'];
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        conf.style.left = (Math.random() * 760) + 'px';
        conf.style.top = (Math.random() * 100) + 'px';
        game.appendChild(conf);
        setTimeout(() => conf.remove(), 1500);
      }, i * 60);
    }
  }

  function sfxCheers() {
    // Ascending fanfare with harmonics
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => {
        playTone(f, 0.3, 'square', 0.12);
        playTone(f * 1.5, 0.3, 'sine', 0.06);
      }, i * 150);
    });
    // Celebratory trill
    setTimeout(() => {
      [1047, 1175, 1319, 1397, 1568].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.12, 'square', 0.1), i * 70);
      });
    }, 600);
  }

  function monsterDefeated() {
    const monster = MONSTERS[currentMonsterIndex];
    const isLastMonster = currentMonsterIndex === MONSTERS.length - 1;

    if (isLastMonster) {
      document.getElementById('battle-message').textContent =
        `${monster.name} has been defeated! You saved Ancient Greece!`;
      sfxCheers();
      showConfetti();
    } else {
      const healAmount = 20 + Math.floor(Math.random() * 16); // 20-35 HP
      playerHp = Math.min(playerHp + healAmount, selectedGod.hp);
      document.getElementById('battle-message').textContent =
        `${monster.name} has been defeated! You recover ${healAmount} HP!`;
      sfxMonsterDefeated();
      showHealHearts('player-canvas', 5);
    }
    updateBattleUI();

    currentMonsterIndex++;
    if (currentMonsterIndex >= MONSTERS.length) {
      setTimeout(() => endGame(true), 2000);
    } else {
      setTimeout(() => startBattle(), 1500);
    }
  }

  function endGame(won) {
    document.getElementById('end-title').textContent = won ? 'Victory!' : 'Defeat!';
    document.getElementById('end-message').textContent = won
      ? 'You saved Ancient Greece!'
      : `You were defeated by the ${MONSTERS[currentMonsterIndex].name}...`;
    document.getElementById('end-stats').innerHTML =
      `Monsters defeated: ${currentMonsterIndex} / ${MONSTERS.length}<br>` +
      `Questions correct: ${questionsCorrect} / ${questionsTotal}<br>` +
      `Accuracy: ${questionsTotal > 0 ? Math.round((questionsCorrect / questionsTotal) * 100) : 0}%`;
    if (won) sfxVictory(); else sfxDefeat();
    showScreen('end-screen');
  }

  // ========== SCREEN MANAGEMENT ==========
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ========== NAVIGATION ==========
  document.getElementById('start-btn').addEventListener('click', () => {
    buildGodSelection();
    showScreen('select-screen');
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    showScreen('title-screen');
  });
</script>
